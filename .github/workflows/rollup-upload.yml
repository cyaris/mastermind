name: Rollup upload

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      production:
        description: Upload bundle.* files instead of staged test_bundle.* files.
        required: true
        type: boolean
        default: false
      dry-run:
        description: Print the S3 operations without writing objects.
        required: true
        type: boolean
        default: false
      svelte-lib-ref:
        description: svelte-lib ref used for the local file dependency.
        required: false
        type: string
        default: ""
      fireworks-ref:
        description: fireworks ref used for the local file dependency.
        required: true
        type: string
        default: dev

jobs:
  resolve-inputs:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      aws_role_to_assume: ${{ steps.values.outputs.aws_role_to_assume }}
      dry_run: ${{ steps.values.outputs.dry_run }}
      fireworks_ref: ${{ steps.values.outputs.fireworks_ref }}
      production: ${{ steps.values.outputs.production }}
      svelte_lib_ref: ${{ steps.values.outputs.svelte_lib_ref }}
    steps:
      - id: values
        env:
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
          INPUT_FIREWORKS_REF: ${{ inputs.fireworks-ref }}
          INPUT_PRODUCTION: ${{ inputs.production }}
          INPUT_SVELTE_LIB_REF: ${{ inputs.svelte-lib-ref }}
          VAR_AWS_ROLLUP_UPLOAD_ROLE_ARN: ${{ vars.AWS_ROLLUP_UPLOAD_ROLE_ARN }}
          VAR_FIREWORKS_REF: ${{ vars.FIREWORKS_REF }}
          VAR_SVELTE_LIB_REF: ${{ vars.SVELTE_LIB_REF }}
        run: |
          set -euo pipefail

          production="$INPUT_PRODUCTION"
          dry_run="$INPUT_DRY_RUN"
          default_svelte_lib_ref="main"
          if [[ "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}" == "dev" || "${GITHUB_REF_NAME:-}" == "dev" ]]; then
            default_svelte_lib_ref="dev"
          fi

          svelte_lib_ref="${INPUT_SVELTE_LIB_REF:-${VAR_SVELTE_LIB_REF:-$default_svelte_lib_ref}}"
          fireworks_ref="${INPUT_FIREWORKS_REF:-${VAR_FIREWORKS_REF:-dev}}"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            production="true"
            dry_run="false"
          fi

          {
            printf "aws_role_to_assume=%s\n" "$VAR_AWS_ROLLUP_UPLOAD_ROLE_ARN"
            printf "dry_run=%s\n" "$dry_run"
            printf "fireworks_ref=%s\n" "$fireworks_ref"
            printf "production=%s\n" "$production"
            printf "svelte_lib_ref=%s\n" "$svelte_lib_ref"
          } >> "$GITHUB_OUTPUT"

  rollup-upload:
    needs: resolve-inputs
    permissions:
      contents: read
      id-token: write
    uses: cyaris/shared-automation/.github/workflows/rollup-upload.yml@main
    with:
      bundle-files: |
        bundle.css:text/css
        bundle.js:application/javascript
      s3-bucket: cyaris.github.io
      s3-prefix: mastermind
      aws-region: us-east-2
      aws-role-to-assume: ${{ needs.resolve-inputs.outputs.aws_role_to_assume }}
      production: ${{ needs.resolve-inputs.outputs.production == 'true' }}
      dry-run: ${{ needs.resolve-inputs.outputs.dry_run == 'true' }}
      svelte-lib-ref: ${{ needs.resolve-inputs.outputs.svelte_lib_ref }}
      local-dependency-repositories: |
        cyaris/fireworks:fireworks:${{ needs.resolve-inputs.outputs.fireworks_ref }}
    secrets:
      CHECKOUT_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
