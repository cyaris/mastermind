name: Auto release

on:
  workflow_dispatch:
    inputs:
      release-sha:
        description: Commit SHA to reconcile releases through. Blank uses the default branch tip.
        required: false
        type: string
        default: ""
      pr-number:
        description: Pull request number to comment on.
        required: false
        type: string
        default: ""
      shared-automation-ref:
        description: shared-automation ref used to run the shared release workflow.
        required: false
        type: string
        default: ""
      publish:
        description: Publish a selected release instead of reporting only.
        required: false
        type: boolean
        default: false
      update-existing:
        description: Update existing release titles and notes.
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  auto-release:
    uses: cyaris/shared-automation/.github/workflows/auto-release.yml@main
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      pr-number: ${{ inputs.pr-number }}
      release-sha: ${{ inputs.release-sha }}
      shared-automation-ref: ${{ inputs.shared-automation-ref || vars.SHARED_AUTOMATION_REF || 'main' }}
      publish: ${{ inputs.publish }}
      update-existing: ${{ inputs.update-existing }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      CHECKOUT_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
