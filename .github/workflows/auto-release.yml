name: Auto release

on:
  pull_request:
    branches:
      - main
      - master
    types:
      - closed
  workflow_dispatch:
    inputs:
      release-sha:
        description: Commit SHA to evaluate and release.
        required: false
        type: string
        default: ""
      pr-number:
        description: Pull request number to comment on.
        required: false
        type: string
        default: ""
      shared-automation-ref:
        description: shared-automation ref used to run the shared release workflow.
        required: false
        type: string
        default: main
      publish:
        description: Publish a selected release instead of reporting only.
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

jobs:
  auto-release-after-pr:
    if: github.event.pull_request.merged == true
    uses: cyaris/shared-automation/.github/workflows/auto-release.yml@main
    permissions:
      contents: write
      issues: write
      pull-requests: read
    with:
      pr-number: ${{ github.event.pull_request.number }}
      release-sha: ${{ github.event.pull_request.merge_commit_sha }}
      shared-automation-ref: ${{ vars.SHARED_AUTOMATION_REF || 'main' }}
      publish: true
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      CHECKOUT_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}

  auto-release-manual:
    if: github.event_name == 'workflow_dispatch'
    uses: cyaris/shared-automation/.github/workflows/auto-release.yml@main
    permissions:
      contents: write
      issues: write
      pull-requests: read
    with:
      pr-number: ${{ inputs.pr-number }}
      release-sha: ${{ inputs.release-sha || github.sha }}
      shared-automation-ref: ${{ inputs.shared-automation-ref || vars.SHARED_AUTOMATION_REF || 'main' }}
      publish: ${{ inputs.publish }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      CHECKOUT_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
