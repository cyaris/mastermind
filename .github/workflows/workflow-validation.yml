name: Workflow validation

on:
  push:
    branches:
      - dev
      - master
    paths:
      - ".github/release-policy.yml"
      - ".github/workflows/**"
      - "renovate.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-validation:
    uses: cyaris/shared-automation/.github/workflows/workflow-validation.yml@main
